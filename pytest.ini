[pytest]
# Automatically enable asyncio for async tests
asyncio_mode = auto

# Test discovery paths
testpaths = tests

# Test naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
console_output_style = progress
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (e.g., performance tests)
    retrieval: Tests for retrieval module
